services:
  jekyll:
    image: jekyll/jekyll:latest
    volumes:
      - .:/srv/jekyll              # Mount CV repo
      - ../modern-resume-theme:/srv/modern-resume-theme  # Mount local theme
      - bundle_cache:/usr/local/bundle  # Cache gems
    ports:
      - "4000:4000"
    environment:
      - JEKYLL_ENV=development
      - BUNDLE_PATH=/usr/local/bundle
      - BUNDLE_BIN=/usr/local/bundle/bin
      - BUNDLE_APP_CONFIG=/usr/local/bundle
    command: sh -c "bundle check || bundle install && jekyll build && jekyll serve --livereload --host 0.0.0.0 --verbose"

volumes:
  bundle_cache:
